<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Gaming Dungeon">
  <!-- A coin door: the hinged front panel of a cabinet, and the way in.
       Redrawn 2026-08-29 in Heavenpillar's ink-and-paper palette (paper
       plate, ink border, gold slots) instead of the old violet-on-black.
       Still only axis-aligned rects on a 32px grid with integer
       coordinates: tools/branding.mjs draws rects and THROWS on anything
       else, so a curve added here fails the build rather than quietly
       vanishing from every icon. -->
  <rect width="32" height="32" rx="5" fill="#f6f3e9"/>
  <rect x="2" y="2" width="28" height="28" rx="4" fill="none" stroke="#1b1815" stroke-width="2"/>
  <rect x="7" y="6" width="18" height="20" rx="2" fill="none" stroke="#1b1815" stroke-width="2"/>
  <rect x="11" y="10" width="10" height="6" fill="#1b1815" opacity=".82"/>
  <rect x="14" y="19" width="4" height="1.6" fill="#a8822a"/>
  <rect x="14" y="22" width="4" height="1.6" fill="#a8822a" opacity=".55"/>
</svg>
