<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Gaming Dungeon">
  <!-- A coin door: the hinged front panel of a cabinet, and the way in.
       Drawn on a 32px grid on purpose so it stays crisp at favicon size;
       every coordinate is an integer and there are no curves to soften. -->
  <rect width="32" height="32" rx="5" fill="#0a0413"/>
  <rect x="6" y="5" width="20" height="22" rx="2" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <rect x="10" y="9" width="12" height="7" fill="#a78bfa" opacity=".85"/>
  <rect x="14" y="20" width="4" height="1.6" fill="#f0b93c"/>
  <rect x="14" y="23" width="4" height="1.6" fill="#f0b93c" opacity=".55"/>
</svg>
