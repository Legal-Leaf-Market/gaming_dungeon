<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Verda Studio">
  <!-- VERDA STUDIO: the enso and the brush V, reduced to what
       survives 16 pixels.

       Taken from the studio's own logo, which is an ink-wash circle
       around a brush-drawn V with mountains, a pagoda and cloud
       scrollwork inside it. None of that interior detail survives at
       favicon size; what carries the identity is the RING and the V,
       so those are what this keeps. A favicon is not a small logo, it
       is the logo's silhouette.

       NOT THE RASTER. The studio artwork was sent as a conversation
       image rather than a file, so its pixels were never on disk here
       and this is a redraw, not a trace. If the real PNG is dropped
       into public/assets/ it can replace the generated icons
       wholesale; until then this is honest about being a reduction.

       The enso is closed. Real ones have a gap, and at 16px a gap in
       a 2.6px stroke reads as a rendering fault rather than as a
       brushstroke lifting.

       The V is two rotated rects with rounded ends, which is all a
       brush stroke is at this size. tools/branding.mjs draws rotated
       rects and ellipses; it still refuses paths, so anything more
       calligraphic than this fails the build rather than quietly
       vanishing from every icon. -->
  <rect width="32" height="32" rx="5" fill="#f6f3e9"/>
  <ellipse cx="16" cy="16" rx="12.4" ry="12.4" fill="none" stroke="#141210" stroke-width="2.7"/>
  <rect x="11.05" y="8.48" width="3.50" height="14.85" rx="1.75" fill="#141210" transform="rotate(154.47 12.80 15.90)"/>
  <rect x="17.70" y="8.48" width="3.00" height="14.85" rx="1.50" fill="#141210" transform="rotate(-154.47 19.20 15.90)"/>
</svg>
